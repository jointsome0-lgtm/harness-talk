[package]
name = "harness-talk"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Exchange messages between local agent sessions"
license = "MIT"
repository = "https://github.com/jointsome0-lgtm/harness-talk"
readme = "README.md"

[[bin]]
name = "htalk"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = "4.5"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.3"
toml = "0.8"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# The TLS handshake boundary uses ureq's unversioned connector API.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
