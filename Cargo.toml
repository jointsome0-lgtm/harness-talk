[package]
name = "harness-talk"
version = "0.14.0"
edition = "2024"
rust-version = "1.88"
description = "Exchange messages between agent sessions"
license = "MIT"
repository = "https://github.com/jointsome0-lgtm/harness-talk"
readme = "README.md"
exclude = [".audit/**"]

[[bin]]
name = "htalk"
path = "src/main.rs"

[features]
default = ["catalog"]
# Publishing profiles and finding them on known devices. Without it the build is the mailbox alone.
catalog = []

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
regex = "1"
rmcp = { version = "3.4.1", default-features = false, features = ["server", "client", "macros", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
mdns-sd = { version = "=0.21.4", default-features = false }

# What `src/os/` is built on.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
