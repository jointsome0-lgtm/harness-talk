name: Build or publish to PyPI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build artifacts only, or publish them to PyPI
        type: choice
        required: true
        default: build-only
        options:
          - build-only
          - publish

permissions: {}

jobs:
  build:
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Select Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
      - name: Test native contracts
        run: cargo test --locked
      - name: Build and check binary wheel and source distribution
        run: |
          python -m pip install 'maturin[zig]>=1.15,<2' twine
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            maturin build --release --locked --zig --compatibility manylinux_2_28 --sdist --target-dir "$RUNNER_TEMP/dist-build" --out dist
          else
            maturin build --release --locked --zig --compatibility manylinux_2_28 --target-dir "$RUNNER_TEMP/dist-build" --out dist
          fi
          python -m twine check --strict dist/*
          sha256sum dist/*
      - name: Test adapter hook lifecycle
        run: python -B -m unittest discover -s tests -p test_hook_lifecycle.py -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Test JavaScript watcher lifecycle
        run: node --experimental-vm-modules --test tests/test_js_watchers.mjs
      - name: Test adapter tool and recovery contracts
        run: |
          python -B -m unittest discover -s tests -p test_agent_tools.py -v
          python -B -m unittest discover -s tests -p test_adapter_recovery.py -v
      - name: Test managed receiver process cleanup
        run: python -B -m unittest discover -s tests -p test_managed_receiver.py -v
      - name: Test the installed wheel outside the checkout
        run: |
          wheel=(dist/*.whl)
          python -m pip install "${wheel[0]}"
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server
          export HTALK_TEST_SSHD=/usr/sbin/sshd
          export HTALK_TEST_COMMAND="$(python -c 'import json, shutil; print(json.dumps([shutil.which("htalk")]))')"
          cp tests/compat_support.py tests/test_cli_compat.py tests/test_mcp.py tests/test_receive.py tests/test_catalog.py tests/test_catalog_channels.py tests/test_mail_recovery.py tests/test_rust_process_cleanup.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          htalk --version
          htalk --help
          python -B -m unittest test_cli_compat test_mcp test_receive test_catalog test_catalog_channels test_mail_recovery test_rust_process_cleanup -v
      - name: Test the agent view of the installed wheel
        run: |
          export HTALK_TEST_COMMAND="$(python -c 'import json, shutil; print(json.dumps([shutil.which("htalk")]))')"
          python -B -m unittest discover -s tests -p test_agent_view.py -v
      - name: Test source archive installation
        if: matrix.arch == 'x86_64'
        run: |
          python -m venv "$RUNNER_TEMP/source-install"
          CARGO_TARGET_DIR="$RUNNER_TEMP/source-build" "$RUNNER_TEMP/source-install/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/source-install/bin/htalk" --version
          "$RUNNER_TEMP/source-install/bin/python" -m pip check
      - name: Store the checked distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-talk-dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # macOS and Windows have the mailbox, pull peers and the MCP tool. Each wheel is installed in a
  # new environment on its own system and the contract of those parts runs against it.
  build-ported:
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: macos-arm64
          - runner: macos-15-intel
            name: macos-x86_64
          - runner: windows-latest
            name: windows-x64
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Select Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test native contracts
        run: cargo test --locked
      - name: Build and check the binary wheel
        run: |
          python -m pip install 'maturin>=1.15,<2' twine
          maturin build --release --locked --target-dir "$RUNNER_TEMP/dist-build" --out dist
          python -m twine check --strict dist/*
          python -c 'import hashlib, pathlib, sys; [print(hashlib.sha256(p.read_bytes()).hexdigest(), p) for p in sorted(pathlib.Path("dist").iterdir())]'
      - name: Test the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          bin="$RUNNER_TEMP/wheel/bin"
          if [ ! -d "$bin" ]; then bin="$RUNNER_TEMP/wheel/Scripts"; fi
          wheel=(dist/*.whl)
          "$bin/python" -m pip install "${wheel[0]}"
          "$bin/python" -m pip check
          export HTALK_TEST_COMMAND="$("$bin/python" -c 'import json, shutil, sys; print(json.dumps([shutil.which("htalk", path=sys.argv[1])]))' "$bin")"
          cp tests/compat_support.py tests/test_cli_compat.py tests/test_mcp.py tests/test_mail_recovery.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$bin/htalk" --version
          "$bin/htalk" --help
          python -c 'import os, platform; print(platform.machine(), os.environ["HTALK_TEST_COMMAND"])'
          python -B -m unittest test_cli_compat test_mcp test_mail_recovery -v
      - name: Start it in a Windows that has no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $image = "mcr.microsoft.com/windows/nanoserver:ltsc2025"
          foreach ($try in 1..3) { docker pull --quiet $image; if ($LASTEXITCODE -eq 0) { break } }
          Copy-Item scripts\windows_clean_start.cmd "$env:RUNNER_TEMP\wheel\Scripts"
          docker run --rm -v "$env:RUNNER_TEMP\wheel\Scripts:C:\htalk" $image cmd /c C:\htalk\windows_clean_start.cmd
      - name: Store the checked distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-talk-dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && github.ref == 'refs/heads/main'
    needs: [build, build-ported]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/harness-talk/
    permissions:
      id-token: write
    steps:
      - name: Download this run's checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: harness-talk-dist-*
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
