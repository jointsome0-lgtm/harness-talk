name: tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Select Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check and test Rust
        if: matrix.python == '3.14'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Test source installation outside the checkout
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          htalk --version
          htalk --help
          python -m pip check
      - name: Test the installed CLI contract
        if: matrix.python == '3.14'
        run: |
          export HTALK_TEST_COMMAND="$(python -c 'import json, shutil; print(json.dumps([shutil.which("htalk")]))')"
          cp tests/compat_support.py tests/test_cli_compat.py tests/test_mcp.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -B -m unittest test_cli_compat test_mcp -v

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the minimum Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --locked --all-targets
