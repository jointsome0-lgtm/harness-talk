name: tests

on:
  push:

permissions:
  contents: read

jobs:
  test:
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Select Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Build the mailbox without the catalogue
        if: matrix.python == '3.14'
        run: |
          cargo build --locked --no-default-features
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Check and test Rust
        if: matrix.python == '3.14'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Test source installation outside the checkout
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          htalk --version
          htalk --help
          python -m pip check
      - name: Test the installed CLI contract
        if: matrix.python == '3.14'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server
          export HTALK_TEST_SSHD=/usr/sbin/sshd
          export HTALK_TEST_COMMAND="$(python -c 'import json, shutil; print(json.dumps([shutil.which("htalk")]))')"
          cp tests/compat_support.py tests/test_cli_compat.py tests/test_mcp.py tests/test_receive.py tests/test_catalog.py tests/test_catalog_channels.py tests/test_mail_recovery.py tests/test_rust_process_cleanup.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -B -m unittest test_cli_compat test_mcp test_receive test_catalog test_catalog_channels test_mail_recovery test_rust_process_cleanup -v
      - name: Test the agent view of the installed CLI
        if: matrix.python == '3.14'
        run: |
          export HTALK_TEST_COMMAND="$(python -c 'import json, shutil; print(json.dumps([shutil.which("htalk")]))')"
          python -B -m unittest discover -s tests -p test_agent_view.py -v
      - name: Test Agent Zero pause handling
        if: matrix.python == '3.14'
        run: python -B -m unittest discover -s tests -p test_agent_zero.py -v
      - name: Test adapter hook lifecycle
        if: matrix.python == '3.14'
        run: python -B -m unittest discover -s tests -p test_hook_lifecycle.py -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.python == '3.14'
        with:
          node-version: "24"
      - name: Test JavaScript watcher lifecycle
        if: matrix.python == '3.14'
        run: node --experimental-vm-modules --test tests/test_js_watchers.mjs
      - name: Test adapter tool and recovery contracts
        run: |
          python -B -m unittest discover -s tests -p test_agent_tools.py -v
          python -B -m unittest discover -s tests -p test_adapter_recovery.py -v
      - name: Test managed receiver process cleanup
        run: python -B -m unittest discover -s tests -p test_managed_receiver.py -v
      - name: Test reverse SSH socket recovery
        run: python -B -m unittest discover -s tests -p test_ssh_sockets.py -v
      - name: Count the tests and the ones that reach inside
        run: python scripts/test_census.py
      - name: Measure the core
        run: python scripts/core_tokens.py

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the minimum Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --locked --all-targets

  # The gate for systems that are being ported: the program builds, the store works and what
  # is not ported there answers unsupported_on_this_platform. build.rs says what each has.
  # Both also run the contract of the mailbox and the MCP tool against the built executable.
  platforms:
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - name: Build the mailbox without the catalogue
        run: |
          cargo build --locked --no-default-features
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Check and test Rust
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Test the CLI contract of the mailbox and the MCP tool
        run: |
          cd tests
          python -B -m unittest test_cli_compat test_mcp test_mail_recovery -v
      - name: Install from the checkout
        run: |
          python -m venv "$RUNNER_TEMP/source"
          bin="$RUNNER_TEMP/source/bin"
          if [ ! -d "$bin" ]; then bin="$RUNNER_TEMP/source/Scripts"; fi
          "$bin/python" -m pip install .
          "$bin/python" -m pip check
          "$bin/htalk" --version
      - name: Start it in a Windows that has no Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $image = "mcr.microsoft.com/windows/nanoserver:ltsc2025"
          foreach ($try in 1..3) { docker pull --quiet $image; if ($LASTEXITCODE -eq 0) { break } }
          Copy-Item scripts\windows_clean_start.cmd "$env:RUNNER_TEMP\source\Scripts"
          docker run --rm -v "$env:RUNNER_TEMP\source\Scripts:C:\htalk" $image cmd /c C:\htalk\windows_clean_start.cmd
