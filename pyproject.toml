[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "harness-talk"
dynamic = ["version"]
description = "Exchange messages between local agent sessions"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
]

[project.urls]
Source = "https://github.com/jointsome0-lgtm/harness-talk"
Issues = "https://github.com/jointsome0-lgtm/harness-talk/issues"

[tool.maturin]
bindings = "bin"
strip = true
locked = true
include = [
    { path = ".cargo/config.toml", format = "sdist" },
    { path = "tests/**", format = "sdist" },
    { path = "docs/**", format = "sdist" },
]
